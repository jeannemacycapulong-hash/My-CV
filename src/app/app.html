<main class="resume">
  <app-header
    [fullName]="fullName"
    [location]="location"
    [email]="email"
    [phone]="phone"
    [profile]="profile" />

  <app-profile-card></app-profile-card>


  <app-skills
    [skills]="skills"
    (skillSelected)="onSkillSelected($event)" />


  <section>
    <h2>Projects</h2>
    <ul class="projects-list">
      @for (project of projects; track project) {
        <li>{{ project }}</li>
      }
    </ul>
  </section>

   <section class="interaction">
    <h2>Angular Interaction</h2>
    <p>{{ message }}</p>
    <button (click)="showMessage()">Click Me</button>
  </section>

  <app-footer
    [fullName]="fullName"
    [proficiencies]="proficiencies" />
</main>
